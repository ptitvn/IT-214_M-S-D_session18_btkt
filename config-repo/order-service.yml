# Cấu hình riêng cho order-service (Config Server phân phát khi service khởi động).
server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shopmart_order?createDatabaseIfNotExist=true
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    consumer:
      group-id: order-service-group

# Câu 2: Resilience4j Circuit Breaker cho lệnh gọi inventory-service qua FeignClient
resilience4j:
  circuitbreaker:
    instances:
      inventoryService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

feign:
  client:
    config:
      inventory-service:
        connect-timeout: 3000
        read-timeout: 3000
  circuitbreaker:
    enabled: false
