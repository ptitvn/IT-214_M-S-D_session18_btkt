# Hạ tầng chạy local cho ShopMart.
#   docker compose up -d
#
# MySQL đã được cấu hình sẵn (mỗi service tự tạo database riêng - Database per Service):
#   shopmart_order | shopmart_inventory | shopmart_payment
# Nếu máy đã có MySQL chạy ở cổng 3306 thì có thể bỏ service mysql bên dưới
# và sửa username/password trong cấu hình của từng service.

services:
  mysql:
    image: mysql:8.0
    container_name: shopmart-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Câu 3: Kafka broker chạy chế độ KRaft (không cần Zookeeper) - single node, dùng cho dev/test.
  kafka:
    image: apache/kafka:3.7.0
    container_name: shopmart-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "ShopMartKRaftClusterId1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # Câu 4: Redis server - dùng cho Cache-Aside của inventory-service
  redis:
    image: redis:7-alpine
    container_name: shopmart-redis
    ports:
      - "6379:6379"

volumes:
  mysql_data:
