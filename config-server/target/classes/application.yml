server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        native:
          # Nhiều đường dẫn dự phòng để chạy được dù working directory là thư mục gốc
          # project (mvn -pl config-server spring-boot:run) hay thư mục module (IntelliJ).
          search-locations: "file:./config-repo,file:../config-repo,file:${user.dir}/config-repo,file:${user.dir}/../config-repo"
  profiles:
    active: native

logging:
  level:
    org.springframework.cloud.config: INFO
